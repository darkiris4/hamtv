<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hamTV</title>
  <link rel="icon" href="/hamtv.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-viewport ambient color blob that shifts with each focused service -->
  <div id="bg-glow" aria-hidden="true"></div>

  <!-- Hero: always-visible top shelf showing the focused service -->
  <header id="hero">
    <!-- Blurred backdrop driven by the focused service's logo -->
    <div id="hero-backdrop" aria-hidden="true"></div>
    <!-- Vignette overlay to keep text readable -->
    <div id="hero-vignette" aria-hidden="true"></div>

    <div id="hero-body">

      <!-- Focused-service card (liquid glass overlay on the hero backdrop) -->
      <a id="hero-card" href="#" tabindex="-1" class="liquid-glass">
        <div class="lg-overlay-bg"></div>
        <div class="lg-content">
          <div id="hero-logo-wrap">
            <img id="hero-logo" src="" alt="" draggable="false">
            <div id="hero-initial" aria-hidden="true"></div>
          </div>
          <div id="hero-meta">
            <h1 id="hero-name"></h1>
            <p  id="hero-tagline"></p>
            <p  id="hero-domain"></p>
          </div>
        </div>
        <div class="lg-filter-layer">
          <div class="glass-box glass-transparent"
               data-blur="0" data-cab="8" data-depth="20"
               data-strength="300" data-saturate="1.5" data-brightness="1.1"></div>
        </div>
      </a>

    </div>

    <!-- Clock pill — top-right corner of hero -->
    <div id="clock-pill" class="liquid-glass">
      <div class="lg-overlay-bg"></div>
      <div class="lg-content">
        <time id="clock-time"></time>
      </div>
      <div class="lg-filter-layer">
        <div class="glass-box glass-transparent"
             data-blur="0" data-cab="4" data-depth="12"
             data-strength="180" data-saturate="1.5" data-brightness="1.1"></div>
      </div>
    </div>

  </header>

  <!-- Content wrapper: positions glass tray + scrolling tile grid -->
  <div id="content">
    <!-- Glass tray overlaps the hero bottom; first tile row floats inside it -->
    <div id="tile-shelf-glass" aria-hidden="true"></div>
    <main id="grid" class="tile-grid"></main>
  </div>

  <script src="liquid-glass.js"></script>
  <script src="app.js"></script>
</body>
</html>
