<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hamTV</title>
  <link rel="icon" href="/hamtv.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-viewport ambient color blob that shifts with each focused service -->
  <div id="bg-glow" aria-hidden="true"></div>

  <!-- Hero: always-visible top shelf showing the focused service -->
  <header id="hero">
    <!-- Blurred backdrop driven by the focused service's logo -->
    <div id="hero-backdrop-prev" aria-hidden="true"></div>
    <div id="hero-backdrop" aria-hidden="true"></div>
    <div id="hero-trailer-wrap" aria-hidden="true">
      <div id="hero-trailer-overlay"></div>
    </div>
    <!-- Vignette overlay to keep text readable -->
    <div id="hero-vignette" aria-hidden="true"></div>

    <div id="hero-body">

      <!-- Focused-service card (liquid glass overlay on the hero backdrop) -->
      <a id="hero-card" href="#" tabindex="-1" class="liquid-glass">
        <div class="lg-overlay-bg"></div>
        <div class="lg-content">
          <div id="hero-logo-wrap">
            <img id="hero-logo" src="" alt="" draggable="false">
            <div id="hero-initial" aria-hidden="true"></div>
          </div>
          <div id="hero-meta">
            <h1 id="hero-name"></h1>
            <p  id="hero-tagline"></p>
            <p  id="hero-domain"></p>
          </div>
        </div>
        <div class="lg-filter-layer">
          <div class="glass-box glass-transparent"
               data-blur="0" data-cab="8" data-depth="20"
               data-strength="300" data-saturate="1.5" data-brightness="1.1"></div>
        </div>
      </a>

    </div>

    <!-- Prev/next title nav — appears when a TMDB tile is focused -->
    <div id="hero-nav">
      <button id="hero-prev" aria-label="Previous title" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button id="hero-next" aria-label="Next title" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Mute/unmute button — appears when a trailer is playing -->
    <button id="mute-btn" aria-label="Unmute trailer" hidden>
      <!-- Speaker-off (muted state) -->
      <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <!-- Speaker-on (unmuted state) -->
      <svg class="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>

    <!-- Clock pill — top-right corner of hero -->
    <div id="clock-pill" class="liquid-glass">
      <div class="lg-overlay-bg"></div>
      <div class="lg-content">
        <time id="clock-time"></time>
      </div>
      <div class="lg-filter-layer">
        <div class="glass-box glass-transparent"
             data-blur="0" data-cab="4" data-depth="12"
             data-strength="180" data-saturate="1.5" data-brightness="1.1"></div>
      </div>
    </div>

  </header>

  <!-- Content wrapper: z-index 20 stacking context above hero -->
  <div id="content">
    <main id="grid" class="tile-grid"></main>
  </div>

  <!-- RetroArch setup modal -->
  <div id="retroarch-modal" role="dialog" aria-modal="true" aria-labelledby="retroarch-modal-title" hidden>
    <div id="retroarch-modal-backdrop"></div>
    <div id="retroarch-modal-dialog">
      <h2 id="retroarch-modal-title">One-time setup required</h2>
      <div id="retroarch-curl-wrap">
        <code id="retroarch-curl-cmd"></code>
        <span id="retroarch-copied-badge">Copied ✓</span>
      </div>
      <p class="ra-hint">Open Terminal &rarr; <kbd>⌘V</kbd> &rarr; <kbd>Return</kbd> &rarr; come back and click Try Again.</p>
      <div id="retroarch-modal-actions">
        <button id="retroarch-try-again-btn">Try Again</button>
        <button id="retroarch-copy-btn">Copy again</button>
        <a href="https://www.retroarch.com/index.php?page=platforms" target="_blank" rel="noopener noreferrer">Not Installed?</a>
      </div>
    </div>
  </div>

  <script src="liquid-glass.js"></script>
  <script src="app.js"></script>
  <script src="js/trailer.js"></script>
</body>
</html>
